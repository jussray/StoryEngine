name: Zapier SDK tooling

on:
  pull_request:
    paths:
      - "story-engine/tools/zapier/**"
      - ".github/workflows/zapier-sdk-tooling.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Materialize verified canonical lockfile
        run: node story-engine/tools/zapier/scripts/sync-lockfile.mjs

      - name: Install isolated tooling dependencies
        run: npm ci --prefix story-engine/tools/zapier --ignore-scripts --no-audit --no-fund

      - name: Typecheck Zapier SDK bootstrap
        run: npm --prefix story-engine/tools/zapier run typecheck

# Read-only plan only. Never apply or deploy from this workflow.
name: Railway IaC plan only
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".railway/**"
      - ".github/workflows/railway-iac-plan.yml"

permissions:
  contents: read
  pull-requests: write
  actions: read
  id-token: write

concurrency:
  group: railway-iac-plan-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify current main, exact PR head, and merge-result ancestry
        shell: bash
        env:
          EVENT_MAIN: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          live_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          live_head="$(git ls-remote origin "refs/heads/$PR_HEAD_REF" | cut -f1)"
          [[ "$live_main" == "$EVENT_MAIN" ]] || { echo '::error::main drift; re-plan'; exit 1; }
          [[ "$live_head" == "$EVENT_HEAD" ]] || { echo '::error::PR head drift; re-plan'; exit 1; }
          git merge-base --is-ancestor "$live_main" HEAD
          git merge-base --is-ancestor "$live_head" HEAD
      - name: Require existing account or workspace Railway API key
        shell: bash
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_KEY }}
        run: |
          if [[ -z "$RAILWAY_API_TOKEN" ]]; then
            echo "::error::Missing RAILWAY_API_KEY GitHub secret; cannot authenticate Railway API-token plan"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install IaC SDK in ephemeral runner only
        run: npm install --save-dev --save-exact --no-package-lock --ignore-scripts --no-audit --no-fund railway@3.12.0
      - name: Install Railway CLI for read-only plan
        run: npm install -g @railway/cli@5.71.1
      - name: Link exact Railway project and production environment
        shell: bash
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_KEY }}
        run: |
          set -euo pipefail
          unset RAILWAY_TOKEN
          railway link --project "d497b2c2-4cfc-4e0d-8441-bd48eb02baae" --environment "ad033208-07f8-47d8-9218-66618ad83ae7" --json
      - name: Preview Railway IaC changes (never apply)
        id: railway_plan
        shell: bash
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_KEY }}
        run: |
          set -euo pipefail
          unset RAILWAY_TOKEN
          railway config plan --out railway-plan.json
      - name: Upload plan evidence
        if: steps.railway_plan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: railway-plan-review-only
          path: railway-plan.json
          retention-days: 7
      - name: Block destructive or non-zero migration changes
        env:
          EXPECTED_RAILWAY_ENVIRONMENT: "ad033208-07f8-47d8-9218-66618ad83ae7"
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const plan = JSON.parse(fs.readFileSync('railway-plan.json', 'utf8'));
          const changes = plan.changeSet?.changes;
          if (plan.environmentId !== process.env.EXPECTED_RAILWAY_ENVIRONMENT || !Array.isArray(changes)) {
            console.error('Invalid plan identity or missing change set; blocking.');
            process.exit(1);
          }
          if (plan.destructive || changes.length !== 0) {
            console.error(`Blocked: destructive=${Boolean(plan.destructive)}; change count=${changes.length}. Review provider-generated import before release.`);
            process.exit(1);
          }
          console.log('Verified: exact environment, zero changes, non-destructive Railway plan.');
          NODE

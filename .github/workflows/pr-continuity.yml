name: PR Continuity

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
      - edited
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
      - edited
  workflow_dispatch:

permissions: {}

concurrency:
  group: pr-continuity-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-head-audit:
    name: PR Continuity Exact-Head Gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: read
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Attack 20 continuity contract
        run: node --test test/pr-continuity.attack20.test.mjs

      - name: Verify live base ancestry and exact head
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ROOT_BASE_REF: main
        run: node scripts/pr-continuity.mjs audit

      - name: Observe provider plane without averaging source truth
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_STEP_SUMMARY: ${{ env.GITHUB_STEP_SUMMARY }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const repository = process.env.GITHUB_REPOSITORY;
          const proofSubjectSha = process.env.EXPECTED_HEAD_SHA;
          const token = process.env.GITHUB_TOKEN;
          const checkName = 'Workers Builds: storyengine';
          if (!repository || !proofSubjectSha || !token) throw new Error('PROVIDER_OBSERVATION_INPUT_REQUIRED');

          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${token}`,
            'X-GitHub-Api-Version': '2022-11-28',
            'User-Agent': 'juss-provider-plane-observer-v1',
          };

          let matching = [];
          for (let attempt = 0; attempt < 6; attempt += 1) {
            const response = await fetch(`https://api.github.com/repos/${repository}/commits/${proofSubjectSha}/check-runs?per_page=100`, { headers });
            if (!response.ok) throw new Error(`PROVIDER_CHECK_READ_${response.status}`);
            const payload = await response.json();
            matching = (payload.check_runs || []).filter((row) => row.name === checkName);
            if (matching.length) break;
            if (attempt < 5) await new Promise((resolve) => setTimeout(resolve, 5000));
          }

          matching.sort((a, b) => Date.parse(b.started_at || b.completed_at || 0) - Date.parse(a.started_at || a.completed_at || 0));
          const check = matching[0] || null;
          let observedState = 'UNOBSERVED';
          if (check?.status && check.status !== 'completed') observedState = 'IN_PROGRESS';
          else if (check?.conclusion === 'success') observedState = 'SUCCESS_ROLE_UNVERIFIED';
          else if (check?.conclusion) observedState = String(check.conclusion).toUpperCase();

          const receipt = {
            schema: 'juss/provider-plane@v1',
            repository,
            proofSubjectSha,
            checkName,
            checkRunId: check?.id || null,
            providerExternalId: check?.external_id || null,
            providerCheckStatus: check?.status || null,
            providerCheckConclusion: check?.conclusion || null,
            observedState,
            providerRole: 'UNVERIFIED',
            sourceContinuityIndependent: true,
            productionClaimAllowed: false,
            authorizesMerge: false,
            authorizesDeploy: false,
            invariant: 'Provider success, failure, or absence cannot create production authority without authenticated provider-role and runtime readback.',
          };

          fs.mkdirSync('artifacts', { recursive: true });
          fs.writeFileSync('artifacts/provider-plane.json', `${JSON.stringify(receipt, null, 2)}\n`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            '## Provider plane observation',
            '',
            `- proof subject: \`${proofSubjectSha}\``,
            `- check: \`${checkName}\``,
            `- observed state: **${observedState}**`,
            '- provider role: **UNVERIFIED**',
            '- production claim allowed: **false**',
            '',
            '> Source continuity and provider truth are separate planes. This observation never grants merge or deploy authority.',
            '',
          ].join('\n'));
          console.log(JSON.stringify(receipt));
          NODE

      - name: Retain continuity receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-continuity-${{ github.event.pull_request.head.sha }}
          path: |
            artifacts/pr-continuity.json
            artifacts/provider-plane.json
          if-no-files-found: ignore
          retention-days: 14

  metadata-receipt:
    name: PR Continuity Metadata Receipt
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out trusted base evaluator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Verify trusted Attack 20 contract
        run: node --test test/pr-continuity.attack20.test.mjs

      - name: Refresh managed PR continuity block
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ROOT_BASE_REF: main
        run: node scripts/pr-continuity.mjs metadata

  rollover:
    name: Roll Current Main Through Open PR Graph
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out trusted current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Attack 20 before write authority
        run: node --test test/pr-continuity.attack20.test.mjs

      - name: Roll main forward without force, rebase, or conflict guessing
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ROOT_BASE_REF: main
        run: node scripts/pr-continuity.mjs rollover

      - name: Retain rollover receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-continuity-rollover-${{ github.sha }}
          path: artifacts/pr-continuity.json
          if-no-files-found: ignore
          retention-days: 14

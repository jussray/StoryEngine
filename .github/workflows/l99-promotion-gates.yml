name: L99 Promotion Gates

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: l99-promotion-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Promotion gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run L99 promotion gates
        run: python runtime/promotion_gates.py

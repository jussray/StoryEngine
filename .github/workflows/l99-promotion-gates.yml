name: L99 Promotion Gates

on:
  push:
    branches:
      - main
    paths:
      - 'runtime/**'
      - 'policies/**'
      - 'schemas/**'
      - 'configs/**'
      - 'samples/**'
      - 'docs/**'
      - 'artifacts/**'
      - 'dashboards/**'
      - '.security/**'
      - '.control-room/**'
      - 'control-room.manifest.json'
      - 'story-engine/public/l99_auth.js'
      - 'story-engine/lib/securityContext.js'
      - 'story-engine/routes/**'
      - 'story-engine/test/securityContext.test.js'
      - 'story-engine/test/operatorAuthorization.test.js'
      - '.github/workflows/l99-promotion-gates.yml'
      - '.github/workflows/publish-control-room-status.yml'
  pull_request:
    branches: [main]
    paths:
      - 'runtime/**'
      - 'policies/**'
      - 'schemas/**'
      - 'configs/**'
      - 'samples/**'
      - 'docs/**'
      - 'artifacts/**'
      - 'dashboards/**'
      - '.security/**'
      - '.control-room/**'
      - 'control-room.manifest.json'
      - 'story-engine/public/l99_auth.js'
      - 'story-engine/lib/securityContext.js'
      - 'story-engine/routes/**'
      - 'story-engine/test/securityContext.test.js'
      - 'story-engine/test/operatorAuthorization.test.js'
      - '.github/workflows/l99-promotion-gates.yml'
      - '.github/workflows/publish-control-room-status.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: l99-promotion-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Promotion gates
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}

      - name: Verify immutable head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Control Room federation contract tests
        run: python runtime/test_control_room_contract.py

      - name: Run all L99 promotion gates
        run: python runtime/promotion_gates_all.py

      - name: Verify authentication and operator authorization
        working-directory: story-engine
        run: node --test test/securityContext.test.js test/operatorAuthorization.test.js

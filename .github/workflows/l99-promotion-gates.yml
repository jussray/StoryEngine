name: L99 Promotion Gates

on:
  push:
    branches:
      - main
    paths:
      - 'runtime/**'
      - 'policies/**'
      - 'schemas/**'
      - 'configs/**'
      - 'samples/**'
      - 'docs/**'
      - 'artifacts/**'
      - 'dashboards/**'
      - '.control-room/**'
      - '.github/workflows/l99-promotion-gates.yml'
  pull_request:
    paths:
      - 'runtime/**'
      - 'policies/**'
      - 'schemas/**'
      - 'configs/**'
      - 'samples/**'
      - 'docs/**'
      - 'artifacts/**'
      - 'dashboards/**'
      - '.control-room/**'
      - '.github/workflows/l99-promotion-gates.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  gates:
    name: Promotion gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run L99 promotion gates
        run: python runtime/promotion_gates.py

name: L99 Story Engine CI

on:
  push:
    branches:
      - main
    paths:
      - 'story-engine/**'
      - 'AGENTS.md'
      - 'AGENTS_FOUNDER_INTELLIGENCE.md'
      - 'docs/FOUNDER_INTELLIGENCE_CONSTITUTION.md'
      - 'scripts/verify-juss-os-commands.mjs'
      - 'scripts/control-room-test-ledger.mjs'
      - 'test/control-room-test-ledger.test.mjs'
      - '.github/workflows/control-room-test-ledger.yml'
      - '.github/workflows/l99-story-engine.yml'
      - '.github/workflows/story-engine-production-signal.yml'
      - '.github/workflows/story-engine-production-proof.yml'
      - '.gitignore'
  pull_request:
    paths:
      - 'story-engine/**'
      - 'AGENTS.md'
      - 'AGENTS_FOUNDER_INTELLIGENCE.md'
      - 'docs/FOUNDER_INTELLIGENCE_CONSTITUTION.md'
      - 'scripts/verify-juss-os-commands.mjs'
      - 'scripts/control-room-test-ledger.mjs'
      - 'test/control-room-test-ledger.test.mjs'
      - '.github/workflows/control-room-test-ledger.yml'
      - '.github/workflows/l99-story-engine.yml'
      - '.github/workflows/story-engine-production-signal.yml'
      - '.github/workflows/story-engine-production-proof.yml'
      - '.gitignore'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

permissions:
  contents: read

jobs:
  test:
    name: Node tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}

      - name: Verify immutable head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Show Node version
        run: node --version

      - name: Verify portable Juss OS command contract
        run: node scripts/verify-juss-os-commands.mjs

      - name: Ensure deterministic MP4 renderer is available
        working-directory: story-engine
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Inspect exact Docker carrier for runtime capability and leakage
        shell: bash
        run: |
          set -euo pipefail
          image="storyengine-package-audit:${EXPECTED_HEAD_SHA}"
          docker build --tag "$image" story-engine

          docker run --rm --entrypoint node "$image" --input-type=module -e "
            const { chromium } = await import('playwright');
            const browser = await chromium.launch({ headless: true });
            try {
              const page = await browser.newPage();
              await page.setContent('<main data-testid=\"runtime-browser-probe\">browser-ok</main>');
              const value = await page.locator('[data-testid=\"runtime-browser-probe\"]').textContent();
              if (value !== 'browser-ok') throw new Error('production Playwright browser probe failed');
            } finally {
              await browser.close();
            }
          "

          cid="$(docker create "$image")"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          rm -rf /tmp/storyengine-package-audit
          mkdir -p /tmp/storyengine-package-audit
          docker export "$cid" | tar -x -C /tmp/storyengine-package-audit app
          find /tmp/storyengine-package-audit/app -type f -printf '%P\n' | sort > /tmp/storyengine-package-files.txt
          grep -v '^node_modules/' /tmp/storyengine-package-files.txt > /tmp/storyengine-source-files.txt || true
          cat /tmp/storyengine-source-files.txt

          if grep -E '(^|/)\.git(/|$)|(^|/)(test|e2e|playwright-report|test-results|blob-report|coverage)(/|$)|(^|/)playwright[^/]*\.js$|(^|/)[^/]+\.(db|sqlite|sqlite3)(-wal|-shm)?$|(^|/)[^/]+\.(pem|key)$' /tmp/storyengine-source-files.txt; then
            echo 'Forbidden runtime, test, proof, VCS, or private-key artifact found in packaged application source.' >&2
            exit 1
          fi

          env_hits="$(grep -E '(^|/)\.env($|\.)' /tmp/storyengine-source-files.txt | grep -v -E '(^|/)\.env\.example$' || true)"
          if [ -n "$env_hits" ]; then
            printf '%s\n' "$env_hits" >&2
            echo 'Forbidden environment file found in packaged application source.' >&2
            exit 1
          fi

          if grep -RIlE --exclude-dir=node_modules --exclude='.env.example' '(-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|sk_live_[A-Za-z0-9]{16,}|rk_live_[A-Za-z0-9]{16,}|whsec_[A-Za-z0-9]{16,})' /tmp/storyengine-package-audit/app; then
            echo 'Credential-shaped material found in packaged application source.' >&2
            exit 1
          fi

      - name: Run L99 integration tests
        working-directory: story-engine
        run: npm test

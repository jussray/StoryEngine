name: Guardrails Playwright

on:
  push:
    branches: [main, 'security/**']
    paths:
      - 'story-engine/**'
      - 'docs/VISION.md'
      - 'docs/GUARDRAILS.md'
      - '.mcp.json'
      - '.mcp.example.json'
      - '.vscode/mcp.json'
      - 'scripts/verify_mcp_config.py'
      - '.github/workflows/guardrails-playwright.yml'
  pull_request:
    paths:
      - 'story-engine/**'
      - 'docs/VISION.md'
      - 'docs/GUARDRAILS.md'
      - '.mcp.json'
      - '.mcp.example.json'
      - '.vscode/mcp.json'
      - 'scripts/verify_mcp_config.py'
      - '.github/workflows/guardrails-playwright.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  verify-guardrails:
    runs-on: ubuntu-latest
    # FFmpeg installation on the hosted Ubuntu runner may exceed 20 minutes;
    # keep all browser and security tests enabled, with a finite job ceiling.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: story-engine
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
      - name: Verify immutable head
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: story-engine/package-lock.json
      - name: Verify project-scoped Supabase MCP boundary
        working-directory: .
        run: python scripts/verify_mcp_config.py
      - name: Run exact-head founder truth gate
        working-directory: .
        run: python runtime/founder_truth_gate.py
      - run: npm ci
      - name: Ensure deterministic MP4 renderer is available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            # The hosted apt mirror can be slow. Bound each network operation
            # so a stalled dependency install fails instead of hanging forever.
            timeout --signal=TERM --kill-after=15s 15m sudo apt-get -o Acquire::Retries=2 update
            timeout --signal=TERM --kill-after=15s 25m sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends ffmpeg
          fi
          command -v ffmpeg
          ffmpeg -version | head -n 1
      - name: Run Node tests with retained evidence
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee node-test-output.log
      - run: npx playwright install --with-deps chromium
      - run: npm run test:guardrails
      - name: Verify FCR product-build federation contract
        run: npx playwright test e2e/product-build-control.spec.js
      - name: Verify real creator persistence path
        run: npx playwright test e2e/creator_persistence.spec.js
      - name: Verify autonomous book end to end
        run: npx playwright test --config=playwright.book.config.js
      - name: Verify business metrics evidence path
        run: npx playwright test e2e/business_metrics.spec.js
      - name: Verify local domain authority
        run: npm run test:domain
      - name: Verify Story Video Engine in Control Room
        run: npx playwright test e2e/video_engine.spec.js
      - name: Verify Movie Mode motion contract
        run: npx playwright test e2e/movie_motion.spec.js
      - name: Verify V2 Story Universe runtime persistence
        run: npx playwright test e2e/story_universe.spec.js
      - name: Verify V2.1 source understand and canonize contract
        run: npx playwright test e2e/source_canonize.spec.js
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l99-test-evidence
          path: |
            artifacts/founder-truth/
            story-engine/node-test-output.log
            story-engine/playwright-report/
            story-engine/test-results/
          if-no-files-found: ignore

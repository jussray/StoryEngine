name: Guardrails Playwright

on:
  pull_request:
    paths:
      - 'story-engine/**'
      - 'docs/VISION.md'
      - 'docs/GUARDRAILS.md'
      - '.github/workflows/guardrails-playwright.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-guardrails:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: story-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: story-engine/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:guardrails
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l99-playwright-report
          path: story-engine/playwright-report/
          if-no-files-found: ignore

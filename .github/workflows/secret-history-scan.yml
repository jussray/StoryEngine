name: Secret History Scan

# Scans every blob in the repository's full history — all branches, all PR heads,
# all tags and the exact head under test, including deleted files — for committed
# credentials. Uses no reusable actions: plain git + Python standard library only.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-history-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  scan:
    name: Secret History Scan
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Fetch exact head and full history without reusable actions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          # Token is passed per command only; it is never written to .git/config.
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="$auth" fetch --no-tags --prune origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/pull/*/head:refs/remotes/pull/*' \
            '+refs/tags/*:refs/tags/*' \
            "+${EXPECTED_HEAD_SHA}:refs/scan/head"
          git checkout -q --detach "$EXPECTED_HEAD_SHA"
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\nrefs=%s\ncommits=%s\n' "$EXPECTED_HEAD_SHA" "$actual" \
            "$(git for-each-ref | wc -l)" "$(git rev-list --all --count)"
          test "$actual" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse --is-shallow-repository)" = "false"

      - name: Pin the scanner to main so a change cannot weaken its own gate
        shell: bash
        run: |
          set -euo pipefail
          scanner="$RUNNER_TEMP/scan_history.py"
          if git cat-file -e origin/main:scripts/scan_history.py 2>/dev/null; then
            git show origin/main:scripts/scan_history.py > "$scanner"
            echo "scanner source: origin/main"
          else
            cp scripts/scan_history.py "$scanner"
            echo "scanner source: exact head (bootstrap: main has no scanner yet)"
          fi
          echo "SCANNER=$scanner" >> "$GITHUB_ENV"
          if git cat-file -e origin/main:.secret-scan-allow 2>/dev/null || test -f .secret-scan-allow; then
            added="$(git diff --no-color -U0 origin/main -- .secret-scan-allow | grep -E '^\+fp:' || true)"
            if [ -n "$added" ]; then
              while IFS= read -r line; do echo "::warning file=.secret-scan-allow::allowlist entry added in this change — needs human review: ${line#+}"; done <<< "$added"
            fi
          fi

      - name: Prove the scanner on a canary repository
        run: python3 "$SCANNER" --self-test

      - name: Scan full history
        run: python3 "$SCANNER" . --receipt "$RUNNER_TEMP/secret-scan-receipt.json"

      - name: Publish redacted receipt summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/secret-scan-receipt.json"
          test -f "$receipt" || { echo "### Secret history scan: no receipt (scan did not complete)" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          python3 - "$receipt" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1]))
          cell = lambda t: str(t).replace("|", "\\|").replace("`", "'").replace("\n", " ")
          print(f"### Secret history scan: {r['verdict']}")
          print(f"head `{r['head']}` · refs {r['refs']} · commits {r['commits']} · blobs {r['blobs']} · "
                f"scanned {r['textBlobsScanned']} · not scanned {len(r.get('skipped', []))}")
          print(f"fingerprint `{r['fingerprint']}` · proof cookie `{r['proofCookie']}`")
          if r["findings"]:
              print("\n| Severity | Rule | Fingerprint | Path |\n|---|---|---|---|")
              for f in r["findings"]:
                  sev = "ALLOWED" if f["allowed"] else f["severity"]
                  print(f"| {sev} | {cell(f['rule'])} | {f['fingerprint']} | {cell(f['path'])}:{f['line']} |")
          PY

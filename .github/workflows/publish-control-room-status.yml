name: Publish L99 Control Room Status

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths:
      - 'control-room.manifest.json'
      - 'runtime/portfolio_status.py'
      - 'runtime/test_portfolio_status.py'
      - 'runtime/promotion_gates.py'
      - '.github/workflows/publish-control-room-status.yml'

concurrency:
  group: l99-control-room-status-${{ github.ref }}
  cancel-in-progress: true

env:
  STATUS_PATH: artifacts/control-room/l99-status.json
  STATUS_ARTIFACT: l99-control-room-status-${{ github.sha }}
  FOUNDER_CONTROL_ROOM_URL: https://oojzfmmywbvficgybaxd.supabase.co/functions/v1/ingest-l99-status

jobs:
  build-status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test status exporter
        run: python runtime/test_portfolio_status.py

      - name: Build exact-head sanitized status
        run: |
          python runtime/portfolio_status.py \
            --commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output "$STATUS_PATH"

      - name: Upload status evidence
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.STATUS_ARTIFACT }}
          path: ${{ env.STATUS_PATH }}
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name != 'pull_request'
    needs: build-status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download exact-head status evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.STATUS_ARTIFACT }}
          path: artifacts/control-room

      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=founder-control-room")"
          token="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$response")"
          test -n "$token"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Send observation to Founder Control Room
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --show-error --silent \
            --retry 2 --retry-all-errors \
            -X POST "$FOUNDER_CONTROL_ROOM_URL" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary "@$STATUS_PATH"

  enforce-gates:
    needs: build-status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Download exact-head status evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.STATUS_ARTIFACT }}
          path: artifacts/control-room

      - name: Keep failed promotion gates red
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('artifacts/control-room/l99-status.json').read_text())
          if payload['gate_status'] != 'pass':
              failed = [item['gate'] for item in payload['gate_results'] if not item['passed']]
              raise SystemExit(f"Promotion gates failed: {', '.join(failed)}")
          print('All promotion gates passed; sanitized observation is valid.')
          PY

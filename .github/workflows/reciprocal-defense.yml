name: Reciprocal Defense Contract
on:
  push:
    branches:
      - feat/reciprocal-defense-hallway
    paths:
      - security/reciprocal-defense.mjs
      - security/reciprocal-ingress.mjs
      - test/reciprocal-defense.test.mjs
      - test/reciprocal-ingress.test.mjs
      - story-engine/server.js
      - .github/workflows/reciprocal-defense.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reciprocal-defense:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify reciprocal defense and ingress invariants
        run: node --test test/reciprocal-defense.test.mjs test/reciprocal-ingress.test.mjs
      - name: Verify StoryEngine ingress wiring
        run: |
          grep -q "observeNodeRequest(req, process.env, 'story-engine')" story-engine/server.js
          grep -q 'writeSyntheticNodeResponse(res, reciprocal)' story-engine/server.js

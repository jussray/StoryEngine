name: Control Room Manifest

on:
  pull_request:
    paths:
      - control-room.manifest.json
      - .github/workflows/control-room-manifest.yml
  push:
    branches: [main]
    paths:
      - control-room.manifest.json
      - .github/workflows/control-room-manifest.yml

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false
      - name: Verify exact head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate manifest contract
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const raw = fs.readFileSync('control-room.manifest.json', 'utf8');
          const m = JSON.parse(raw);
          const roles = new Set(['portfolio-control-plane','product-control-room','runtime-operations-layer','product-workbench','commerce-surface','demo-non-authoritative']);
          const statuses = new Set(['planned','integrated','verified','released','blocked','at-risk','demo','historical']);
          const risks = new Set(['low','medium','high','critical']);
          const versions = new Set(['1.0','1.1']);
          if (!versions.has(m.schemaVersion) || m.portfolioHub !== 'jussray/founder-control-room') throw new Error('invalid manifest identity');
          if (!/^[^/]+\/[^/]+$/.test(m.repository) || !roles.has(m.role)) throw new Error('invalid repository or role');
          if (m.controlRoom?.privateContentAllowed !== false) throw new Error('private content must be denied');
          if (!statuses.has(m.evidence?.status)) throw new Error('invalid evidence status');
          if (m.schemaVersion === '1.0') {
            if (!/^[a-f0-9]{40}$/.test(m.evidence?.commit ?? '')) throw new Error('invalid v1.0 evidence commit');
          } else {
            if (!/^[a-f0-9]{40}$/.test(m.evidence?.subject?.commit ?? '')) throw new Error('invalid v1.1 evidence subject commit');
            if (!m.evidence?.subject?.branch) throw new Error('invalid v1.1 evidence subject branch');
            if (m.evidence?.status === 'historical') {
              if (m.evidence?.freshness?.policy !== 'exact-commit') throw new Error('historical evidence must use exact-commit freshness');
              if (m.evidence?.freshness?.currentOnlyWhenRepositoryHeadEqualsSubjectCommit !== true) throw new Error('historical evidence cannot authorize a moved head');
              if (m.evidence?.freshness?.onHeadMovement !== 'historical') throw new Error('head movement must demote evidence to historical');
            }
          }
          if (!risks.has(m.risk?.level) || !Array.isArray(m.risk?.blockers) || !m.nextGate) throw new Error('invalid risk contract');
          if (/(service[_-]?role[_-]?key|api[_-]?key|secret\s*[:=]|sk-[a-z0-9_-]{10,})/i.test(raw)) throw new Error('possible secret');
          console.log(`validated ${m.repository}`);
          NODE

name: One-time StoryEngine repair

on:
  push:
    branches:
      - fix/recover-main-runtime-20260802
    paths:
      - scripts/repair-story-engine-orchestrator.mjs
      - .github/workflows/one-time-story-engine-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/recover-main-runtime-20260802
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply exact-string repair
        run: node scripts/repair-story-engine-orchestrator.mjs

      - name: Prove repaired modules parse
        run: |
          node --check story-engine/lib/storyEngineOrchestrator.js
          node --check story-engine/lib/ghostWriter.js
          node --check story-engine/lib/bootstrapEngine.js
          node --check story-engine/routes/controlRoom.js
          node --check story-engine/test/securityContext.test.js

      - name: Commit repaired source and remove one-time tooling
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add story-engine/lib/storyEngineOrchestrator.js scripts/repair-story-engine-orchestrator.mjs .github/workflows/one-time-story-engine-repair.yml
          git commit -m 'fix: remove StoryEngine merge-conflict residue'
          git push origin HEAD:fix/recover-main-runtime-20260802

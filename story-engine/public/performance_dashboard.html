<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>L99 Performance Dashboard</title>
  <style>
    :root{--bg:#0f0f10;--surface:#171719;--surface2:#202024;--border:#34343a;--text:#e8e8ea;--muted:#8c8c93;--green:#6daa45;--gold:#e8af34;--red:#dd6974;--teal:#4f98a3;--blue:#5591c7;--purple:#a86fdf}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}a{color:var(--teal);text-decoration:none}button{font:inherit}
    header{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0}.brand{font-weight:800}.pill{border:1px solid var(--border);border-radius:999px;padding:4px 9px;font-size:12px;background:var(--surface2)}.ok{color:var(--green)}.warn{color:var(--gold)}.bad{color:var(--red)}.teal{color:var(--teal)}.blue{color:var(--blue)}.purple{color:var(--purple)}
    main{padding:22px;max-width:1280px;margin:auto}.section{margin-bottom:24px}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}h2{font-size:16px;margin:0}.btn{border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:8px;padding:7px 11px;cursor:pointer}
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px}.label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}.value{font-size:26px;font-weight:800;margin:5px 0}.sub{font-size:12px;color:var(--muted)}
    table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}th,td{padding:10px;text-align:left;border-bottom:1px solid var(--border);font-size:13px}th{font-size:11px;text-transform:uppercase;color:var(--muted)}tr:hover td{background:var(--surface2)}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.list{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}.row{padding:12px 14px;border-bottom:1px solid var(--border)}.row:last-child{border-bottom:0}.row-title{font-weight:700}.row-meta{font-size:12px;color:var(--muted);margin-top:3px}.bar{height:6px;border-radius:999px;background:var(--surface2);overflow:hidden}.fill{height:100%;background:var(--green)}
    @media(max-width:780px){main{padding:14px}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header><div class="brand">📈 L99 Performance Dashboard</div><div><span id="live" class="pill warn">Connecting…</span> <button id="refresh" class="btn">Refresh</button> <a class="pill" href="/control_room.html">Control Room</a></div></header>
  <main>
    <section class="section"><div class="head"><h2>Workspace L99 Metrics</h2><span id="updated" class="sub"></span></div><div id="stats" class="stats"></div></section>
    <section class="section"><div class="head"><h2>Workspaces</h2></div><div style="overflow:auto"><table><thead><tr><th>Workspace</th><th>Status</th><th>Events</th><th>p50</th><th>p99</th><th>p99/p50</th><th>Error</th><th>Rollback</th></tr></thead><tbody id="workspaces"></tbody></table></div></section>
    <section class="section grid"><div><div class="head"><h2>Endpoint Metrics</h2></div><div id="endpoints" class="list"></div></div><div><div class="head"><h2>Gating & Incidents</h2></div><div id="incidents" class="list"></div></div></section>
    <section class="section"><div class="head"><h2>Recent Events</h2></div><div id="events" class="list"></div></section>
  </main>
  <script src="/performance_dashboard.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>L99 — Choose Your Workspace</title>
  <script src="/l99_auth.js"></script>
  <script src="/intent_router.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Georgia, serif;
      background: #0a0a0a;
      color: #f0ede8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .stage { width: 100%; max-width: 860px; display: flex; flex-direction: column; gap: 1.5rem; }
    .wordmark { font-size: 1rem; letter-spacing: .3em; text-transform: uppercase; color: #888; text-align: center; }
    h1 { font-size: clamp(2rem, 5vw, 3rem); font-weight: 400; line-height: 1.15; text-align: center; }
    .lede { color: #999; text-align: center; line-height: 1.6; }
    .context-note { color: #777; text-align: center; font-size: .86rem; line-height: 1.45; min-height: 1.25rem; }
    .intent-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .85rem; }
    .intent {
      text-align: left;
      background: #141414;
      color: #f0ede8;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 1.1rem;
      cursor: pointer;
      font: inherit;
      transition: border-color .2s, transform .2s, opacity .2s;
    }
    .intent:hover, .intent:focus-visible { border-color: #777; transform: translateY(-1px); outline: none; }
    .intent:disabled { opacity: .42; cursor: not-allowed; transform: none; border-color: #242424; }
    .intent strong { display: block; font-size: 1rem; margin-bottom: .35rem; }
    .intent span { color: #888; font-size: .88rem; line-height: 1.45; }
    .divider { display: flex; align-items: center; gap: 1rem; color: #555; font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; }
    .divider::before, .divider::after { content: ''; height: 1px; background: #222; flex: 1; }
    .creator { display: flex; flex-direction: column; gap: 1rem; }
    label { font-size: .82rem; letter-spacing: .08em; text-transform: uppercase; color: #888; }
    textarea, select {
      width: 100%;
      background: #141414;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      color: #f0ede8;
      font-family: Georgia, serif;
      font-size: .95rem;
      padding: .75rem;
    }
    textarea { min-height: 100px; resize: vertical; line-height: 1.6; }
    textarea:focus, select:focus { outline: none; border-color: #555; }
    .selectors { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .selector-group { display: flex; flex-direction: column; gap: .4rem; }
    .cta { background: #f0ede8; color: #0a0a0a; border: 0; border-radius: 6px; font: inherit; font-weight: 600; padding: .9rem 1.5rem; cursor: pointer; width: 100%; }
    .cta:disabled { opacity: .35; cursor: not-allowed; }
    .status { font-size: .85rem; color: #888; text-align: center; min-height: 1.2em; }
    .status.error { color: #e05555; }
    @media (max-width: 640px) { .intent-grid, .selectors { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main class="stage">
    <p class="wordmark">L99</p>
    <h1>What do you want to do?</h1>
    <p class="lede">Go straight to the room that owns the work. Your workspace and active run stay with you.</p>

    <section class="intent-grid" aria-label="L99 workspaces">
      <button class="intent" data-intent="WRITE"><strong>Write manuscript</strong><span>Draft and revise in the Writing Room.</span></button>
      <button class="intent" data-intent="RUN"><strong>Control current AI run</strong><span>Open Story Engine runtime and active generation.</span></button>
      <button class="intent" data-intent="CANON"><strong>Manage characters, world, and canon</strong><span>Open Story Universe continuity and memory.</span></button>
      <button class="intent" data-intent="ADAPT"><strong>Adapt to video</strong><span>Move the story into Video Studio.</span></button>
      <button class="intent" data-intent="RELEASE"><strong>Inspect releases</strong><span>Review readiness, quality gates, and blockers.</span></button>
      <button class="intent" data-intent="OPERATE"><strong>Operate system</strong><span>Open runtime, incidents, and system operations.</span></button>
    </section>
    <p class="context-note" id="contextNote" aria-live="polite"></p>

    <div class="divider">or start a new story</div>

    <section class="creator" aria-label="Start a new story">
      <label for="vision">Your story in a sentence or two</label>
      <textarea id="vision" placeholder="A retired astronaut discovers her late husband left clues to a life she never knew..." maxlength="1000"></textarea>
      <div class="selectors">
        <div class="selector-group">
          <label for="medium">Format</label>
          <select id="medium">
            <option value="book">Book</option><option value="picture_book">Picture book</option><option value="movie">Movie</option>
            <option value="tv">TV series</option><option value="song">Song</option><option value="podcast">Podcast</option>
            <option value="game">Game</option><option value="comic">Comic</option><option value="play">Play</option><option value="short_clip">Short clip</option>
          </select>
        </div>
        <div class="selector-group">
          <label for="audience">Audience</label>
          <select id="audience">
            <option value="adult">Adult</option><option value="young_adult">Young adult</option><option value="teen">Teen</option>
            <option value="eli10">Kids (around 10)</option><option value="eli5">Young kids</option><option value="child">Child</option><option value="middle_grade">Middle grade</option>
          </select>
        </div>
      </div>
      <button class="cta" id="startBtn" disabled>Begin</button>
      <p class="status" id="status"></p>
    </section>
  </main>

  <script>
    const contextNote = document.getElementById('contextNote');
    const intentButtons = [...document.querySelectorAll('[data-intent]')];
    let sessionRole = null;

    function syncIntentAvailability() {
      let workspaceLocked = false;
      let runLocked = false;
      let operatorLocked = false;

      for (const button of intentButtons) {
        const intent = button.dataset.intent;
        const resolved = window.L99IntentRouter.resolve(intent);
        const available = window.L99IntentRouter.isAvailable(intent, window.location.href, sessionRole);
        button.disabled = !available;
        button.setAttribute('aria-disabled', String(!available));

        if (!available && resolved?.required_role && sessionRole !== resolved.required_role) {
          operatorLocked = true;
          button.title = 'Administrator access required.';
        } else if (!available && resolved?.required_context === 'workspace_id') {
          workspaceLocked = true;
          button.title = 'Open or create a story first.';
        } else if (!available && resolved?.required_context === 'run_id') {
          runLocked = true;
          button.title = 'Open a Story Engine run first.';
        } else {
          button.removeAttribute('title');
        }
      }

      const notes = [];
      if (workspaceLocked || runLocked) {
        notes.push('Open or create a story to unlock workspace actions. Active-run controls appear when a run ID is present.');
      }
      if (operatorLocked && sessionRole) {
        notes.push('System and release operations require an administrator session.');
      }
      contextNote.textContent = notes.join(' ');
    }

    async function refreshIntentAuthority() {
      try {
        const auth = await window.L99Auth.ensureSession();
        sessionRole = auth?.session?.role || null;
      } catch {
        sessionRole = null;
      }
      syncIntentAvailability();
    }

    for (const button of intentButtons) {
      button.addEventListener('click', () => window.L99IntentRouter.route(
        button.dataset.intent,
        window.location.href,
        sessionRole
      ));
    }
    syncIntentAvailability();
    void refreshIntentAuthority();

    const visionEl = document.getElementById('vision');
    const mediumEl = document.getElementById('medium');
    const audienceEl = document.getElementById('audience');
    const startBtn = document.getElementById('startBtn');
    const statusEl = document.getElementById('status');

    function updateBtn() { startBtn.disabled = visionEl.value.trim().length < 10; }
    visionEl.addEventListener('input', updateBtn);

    startBtn.addEventListener('click', async () => {
      const vision = visionEl.value.trim();
      if (!vision) return;
      startBtn.disabled = true;
      statusEl.textContent = 'Starting your story…';
      statusEl.className = 'status';

      try {
        const res = await fetch('/api/story-engine/runs', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ story_vision: vision, medium: mediumEl.value, audience: audienceEl.value })
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error || `Server error ${res.status}`);
        }
        const run = await res.json();
        const runId = run.run_id || run.run?.run_id;
        const workspaceId = run.workspace_id || run.run?.workspace_id;
        if (!runId) throw new Error('Story Engine did not return a run id.');
        const next = new URLSearchParams({ run_id: runId });
        if (workspaceId) next.set('workspace_id', workspaceId);
        window.location.href = `/story_engine.html?${next.toString()}`;
      } catch (err) {
        statusEl.textContent = err.message || 'Something went wrong. Try again.';
        statusEl.className = 'status error';
        startBtn.disabled = false;
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>L99 Story Engine</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="container">
    <h1>L99 Story Engine</h1>
    <p class="subtitle">Book-first story workspace</p>
    <form id="storyForm">
      <label>Title
        <input type="text" id="title" placeholder="My Story" required>
      </label>
      <label>Genre
        <input type="text" id="genre" placeholder="Literary Fiction">
      </label>
      <label>Pitch
        <textarea id="pitch" rows="4" placeholder="One-sentence pitch..."></textarea>
      </label>
      <button type="submit">Create Workspace →</button>
    </form>
    <div id="error" class="error hidden"></div>
  </main>
  <script src="/front_door.js"></script>
</body>
</html>
